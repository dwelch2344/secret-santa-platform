<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sub for Santa — Browse families</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="brand-bar"></div>
    <header class="site-header">
      <div class="inner">
        <a class="brand" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
          <span><span class="name">Sub for Santa</span><span class="sub" id="org-line">2026 gift drive</span></span>
        </a>
        <nav class="site-nav" id="site-nav" aria-label="Site"></nav>
      </div>
    </header>

    <main class="page">
      <div class="browse-head">
        <div>
          <h1>Browse families</h1>
          <p class="muted" id="browse-sub">Loading…</p>
        </div>
        <div class="filters">
          <label class="field"><span>Household size</span>
            <select id="filter-size">
              <option value="">Any size</option>
              <option value="1-2">1–2 people</option>
              <option value="3-4">3–4 people</option>
              <option value="5+">5 or more</option>
            </select>
          </label>
          <label class="field"><span>Ages</span>
            <select id="filter-ages">
              <option value="">Any</option>
              <option value="under5">Under 5</option>
              <option value="5-12">5 to 12</option>
              <option value="teens">Teens</option>
              <option value="adults">Adults only</option>
            </select>
          </label>
        </div>
      </div>

      <div id="families" class="family-list"><p class="muted">Loading…</p></div>

      <p class="muted small" id="browse-foot"></p>
    </main>

    <script src="/env.js"></script>
    <script type="module" src="brand.js"></script>
    <script type="module" src="browse.js"></script>
    <script type="module" src="site.js"></script>
  </body>
</html>
