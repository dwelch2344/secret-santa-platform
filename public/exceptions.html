<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sub for Santa — Exceptions and activity</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="console">
      <nav class="console-nav" aria-label="Coordinator console">
        <a class="brand" href="/">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12v9H4v-9"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
          <span><span class="name">Sub for Santa</span><span class="sub">Coordinator console</span></span>
        </a>
        <ul id="console-pages"></ul>
      </nav>

      <div class="console-main">
        <header class="topbar">
          <h1 id="page-title">Exceptions</h1>
          <span class="spacer"></span>
          <span class="pill pill-grey hidden" id="env-pill"></span>
          <span class="small muted" id="whoami"></span>
          <a class="btn btn-outline btn-sm" href="/">Home</a>
        </header>

        <main class="console-content" id="exceptions-root">
          <div class="two-col">
            <section class="stack" id="exceptions"></section>
            <section class="card">
              <div class="pick-top">
                <p class="eyebrow">Activity log</p>
                <button type="button" class="btn btn-outline btn-sm" id="export-activity">Export (CSV)</button>
              </div>
              <div id="activity"><p class="muted">Loading…</p></div>
              <p class="muted small">Every status change is recorded with who did it and when — the audit trail a spreadsheet never had.</p>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="/env.js"></script>
    <script type="module" src="brand.js"></script>
    <script type="module" src="exceptions.js"></script>
  </body>
</html>
